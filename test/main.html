import { setup_generic_map } from '__ADDR__/js/generic_map.js';

const MAPDIV = document.querySelector('#mapdiv');
let DRAW_DATA = {

    xx: 20,
    yy: 0
  }
};
let DRAW_EXT = {
  special_circle:function(obj, ctx) {
    let trnsfrm = ctx.get_transform();
    ctx.lineWidth = 1/trnsfrm.a;
    ctx.strokeStyle = 'black';
    ctx.beginPath();
    ctx.arc(obj.xx, obj.yy, 10/trnsfrm.a, 0, 2 * Math.PI, false);
    ctx.stroke();
    let fontsize = Math.max(1, Math.floor(12/trnsfrm.a));
    ctx.font = fontsize + 'px Courier';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'black';
    ctx.scale(1,-1);
    ctx.fillText('Special!', obj.xx, -obj.yy);
    ctx.scale(1,-1);
  },
  rainbow:function(obj, ctx) {
    let trnsfrm = ctx.get_transform();
    let r = obj.radius/trnsfrm.a;
    let n = (obj.points) ? obj.points.length : 0;
    for (var ii = 0; ii < n; ii++) {
      let p = obj.points[ii];
      ctx.fillStyle = \`hsl(\${Math.floor(300*ii/n)},100%,50%)\`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, 2 * Math.PI, false);
      ctx.fill();
    }
  }
};
let MAPFUNCS = setup_generic_map(MAPDIV, DRAW_DATA, DRAW_EXT);
MAPFUNCS.centerMapWithDimensions(10,0,30,30)
// ctx is the zoom/pan-aware canvas context from zoom_pan_canvas.js;

import { setup_generic_map } from '__ADDR__/js/generic_map.js';
import * as ARCS from '__ADDR__/js/arcs.js';

const MAPDIV = document.querySelector('#mapdiv');
const ANIM_PERIOD = 10; // seconds per loop
const ARC_PATH = ARCS.make_arc_path(0, 300, 0, [
  {curvature:0.02, length: 25*Math.PI},
  {curvature:0, length: 80},
  {curvature:0.02, length: 25*Math.PI},
  {curvature:-0.02, length: -25*Math.PI},
  {curvature:0, length: -80}
]);
const LTOT = ARCS.arcs_length(ARC_PATH);
let DRAW_DATA = {
  animation:{
    draw_type: 'animation',
    independent_variable_scale: LTOT/ANIM_PERIOD,
    arc_path: ARC_PATH,
    draw_path: {stroke:'steelblue', stroke_width:1},
    items: [
      {draw_type:'circle', x:0, y:0, radius:8, fill:'steelblue', stroke:'navy', stroke_width:1},

(function animStep() {
  DRAW_DATA.__independent_variable__ = ((performance.now() - t0) / 1000) % ANIM_PERIOD;
  MAPFUNCS.draw();
  requestAnimationFrame(animStep);
})();

// Vanilla-JS replacement for flex.js's drag-resize behavior: each ".resizer"
// grows/shrinks its previous/next sibling panel by adjusting flex-grow in
// proportion to their current pixel widths, then re-runs the same resize
// hooks (codeResize/resizex) the old onresize="..." attributes used to call.
document.querySelectorAll('.resizer').forEach((resizer) => {
  resizer.addEventListener('mousedown', (md) => {
    const prev = resizer.previousElementSibling;
    const next = resizer.nextElementSibling;
    if (!prev || !next) return;
    md.preventDefault();

    let prevSize = prev.offsetWidth;
    let nextSize = next.offsetWidth;
    const sumSize = prevSize + nextSize;
    const sumGrow = Number(prev.style.flexGrow) + Number(next.style.flexGrow);
    let lastPos = md.pageX;

    // An iframe is its own document, so once the cursor crosses into one it
    // captures mousemove/mouseup itself instead of the window listeners below
    // ever seeing them -- silently freezing the drag. Disable pointer events
    // on every iframe for the duration of the drag and restore them after.
    const iframes = document.querySelectorAll('iframe');
    const prevPointerEvents = [];
    iframes.forEach((f) => { prevPointerEvents.push(f.style.pointerEvents); f.style.pointerEvents = 'none'; });

    const html = document.querySelector('html');
    html.style.cursor = 'col-resize';

    function onMouseMove(mm) {
      let pos = mm.pageX;
      let d = pos - lastPos;
      prevSize += d;
      nextSize -= d;
      if (prevSize < 0) {
        nextSize += prevSize;
        pos -= prevSize;
        prevSize = 0;
      }
      if (nextSize < 0) {
        prevSize += nextSize;
        pos += nextSize;
        nextSize = 0;
      }
      prev.style.flexGrow = sumGrow * (prevSize / sumSize);
      next.style.flexGrow = sumGrow * (nextSize / sumSize);
      lastPos = pos;
      codeResize();
      resizex();
    }

    function onMouseUp() {
      html.style.cursor = 'default';
      iframes.forEach((f, i) => { f.style.pointerEvents = prevPointerEvents[i]; });
      window.removeEventListener('mousemove', onMouseMove);
      window.removeEventListener('mouseup', onMouseUp);
    }

    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('mouseup', onMouseUp);
  });
});
